# Деревья решений и ансамбли деревьев: sklearn, LightGBM, XGBoost, CatBoost.
id: trees
title: Деревья решений и ансамбли деревьев
requirement: FR-D11
applies_to:
  families: [tree, ensemble/bagging, ensemble/boosting]
  task_types: [classification/binary, classification/multiclass, regression]
detect:
  tree: [DecisionTreeClassifier, DecisionTreeRegressor, ExtraTreeClassifier, ExtraTreeRegressor]
  ensemble/bagging:
    - RandomForest*
    - ExtraTreesClassifier
    - ExtraTreesRegressor
    - Bagging*
  ensemble/boosting:
    - GradientBoosting*
    - HistGradientBoosting*
    - AdaBoost*
    - LGBM*
    - XGB*
    - CatBoost*
params:
  # null — без ограничения в sklearn и XGBoost, -1 — в LightGBM; depth — CatBoost
  max_depth: {aliases: [max_depth, depth], unbounded: [null, -1]}
  min_samples_leaf: {aliases: [min_samples_leaf, min_child_samples, min_data_in_leaf]}
  max_leaf_nodes: {aliases: [max_leaf_nodes, num_leaves, max_leaves], unbounded: [null, 0]}
  n_estimators:
    aliases: [n_estimators, num_iterations, num_boost_round, iterations, max_iter]
  learning_rate: {aliases: [learning_rate, eta]}
  ccp_alpha: {aliases: [ccp_alpha]}
thresholds:
  extreme_share: 0.9    # доля вероятностей ровно 0 или 1 — листья чистые
  importance_share: 0.3 # доля важности признака от суммы важностей своего kind
  id_unique_share: 0.9  # доля уникальных значений на train — похож на идентификатор
  min_train: 30         # меньше строк train — уникальность не показательна
  outside_share: 0.2    # доля меток test вне диапазона предсказаний
checks:
  tree.unbounded_depth:
    suggestion: >-
      ограничить рост дерева: подобрать max_depth (например, 3–10) или min_samples_leaf
      (например, 5–50) на валидации, либо обрезку ccp_alpha; различающий эксперимент — то же
      дерево с max_depth = 6: если метрика на test растёт, неограниченное дерево запоминало train
  tree.id_like_importance:
    suggestion: >-
      проверить, откуда берётся признак: номер записи, порядковый id или время загрузки не
      должны быть признаками модели; различающий эксперимент — переобучить без этого признака
      и сравнить метрику на test: сильное падение без него — признак утечки через порядок данных
  tree.extrapolation:
    suggestion: >-
      деревья предсказывают в пределах значений train: при тренде таргета — моделировать
      остаток после тренда (детрендинг) или добавить линейную компоненту (linear_tree в
      LightGBM, линейная модель на тренд); различающий эксперимент — та же модель на
      детрендированном таргете: доля меток вне диапазона предсказаний должна упасть
overrides:
  calibration.ece: >-
    вероятности деревьев — доли классов в листьях, у глубоких деревьев они близки к 0 и 1:
    ограничить глубину или увеличить min_samples_leaf, затем откалибровать на отложенной
    выборке (CalibratedClassifierCV, isotonic); различающий эксперимент — ECE до и после
    калибровки на одной модели
  curves.overfitting: >-
    для бустинга — ранняя остановка по валидации (early_stopping_rounds, n_iter_no_change) или
    меньший learning_rate с большим n_estimators; для деревьев — ограничить max_depth и поднять
    min_samples_leaf; различающий эксперимент — та же модель с ранней остановкой: если метрика
    на test не хуже, лишние итерации переобучали
  curves.underfitting: >-
    модель недообучена: увеличить n_estimators или глубину деревьев, ослабить регуляризацию
    (min_samples_leaf, reg_lambda, min_child_weight); различающий эксперимент — вдвое больше
    итераций при том же learning_rate
  curves.instability: >-
    кривая бустинга скачет: уменьшить learning_rate, поднять subsample и colsample ближе к 1,
    зафиксировать сид; различающий эксперимент — тот же прогон с learning_rate вдвое меньше
