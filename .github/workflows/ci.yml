name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mlflow,mcp]"  # адаптер MLflow (FR-C03) и MCP-сервер (FR-R02)
      - run: pytest
      - run: python -m benchmark --perf  # NFR-06: ревью 100 тыс. примеров без LLM ≤ 2 мин
        if: matrix.python-version == '3.13'
