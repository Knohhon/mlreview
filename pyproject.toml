[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlreview"
dynamic = ["version"]
description = "Open-source ассистент-критик для ML-экспериментов"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MLReview contributors" }]
keywords = ["machine-learning", "experiments", "metrics", "review", "mlflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Ядро не зависит от фреймворков обучения и трекеров (NFR-01);
# интеграции подключаются через extras.
dependencies = []

[project.optional-dependencies]
mlflow = ["mlflow>=2.10"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
mlreview = "mlreview.cli:main"

[project.urls]
Repository = "https://github.com/Knohhon/mlreview"

[tool.hatch.version]
path = "src/mlreview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    # Документация и сообщения пишутся по-русски: кириллица не «неоднозначные символы».
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # магические числа в ассертах допустимы

[tool.ruff.lint.isort]
known-first-party = ["mlreview"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
